<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD-Radar</title>
<style>
:root{--bg:#f3f5f2;--sf:#fff;--ink:#14232b;--mut:#5d6d73;--ln:#d9e0dc;--side:#12303a;--sideink:#cfe3dd;--ac:#0f8b6d;--ac2:#c9831b;--bad:#b3392f;--ok:#0f8b6d;--warn:#c9831b}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0 0 .5em}
h1{font-size:1.6rem}h2{font-size:1.2rem}h3{font-size:1rem}
nav{width:200px;background:var(--side);padding:18px 10px;position:sticky;top:0;height:100vh;flex:none;display:flex;flex-direction:column}
nav .logo{font:600 1.25rem Georgia,serif;color:#fff;padding:0 10px 16px}
nav .logo i{color:var(--ac);font-style:normal}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--sideink);padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 var(--ac)}
nav button:hover{background:rgba(255,255,255,.06)}
main{flex:1;padding:22px 26px;min-width:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,select,textarea,button.b{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:6px;padding:6px 9px}
textarea{width:100%;min-height:70px}
button.b{cursor:pointer}button.b.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.b.warn{border-color:var(--warn);color:var(--warn)}
button.b:hover{filter:brightness(.95)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:middle}
th{font-weight:600;color:var(--mut);cursor:pointer;white-space:nowrap;user-select:none}
tr.row:hover{background:color-mix(in srgb,var(--ac) 7%,transparent);cursor:pointer}
.pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.meter{width:76px;height:8px;background:var(--ln);border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle}
.meter b{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.stat{font:600 1.8rem Georgia,serif}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--ln);border-radius:4px;padding:0 6px;margin:2px;font-size:12px}
.chip.g{border-color:var(--ok);color:var(--ok)}.chip.r{border-color:var(--bad);color:var(--bad)}.chip.w{border-color:var(--warn);color:var(--warn)}
pre{background:var(--bg);padding:10px;border-radius:6px;max-height:240px;overflow:auto;white-space:pre-wrap;font-size:12px}
#toast{position:fixed;bottom:16px;right:16px;background:var(--side);color:#fff;padding:9px 14px;border-radius:6px;display:none;z-index:99}
label{display:block;margin:8px 0 3px;color:var(--mut)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// Settings tab removed — configuration is read directly from .env
const TABS=[["dash","Offers"],["detail","Report"],["profile","Profile & CVs"],["src","Sources"],["contacts","Contacts"]];
const today=new Date().toISOString().slice(0,10);

const DEFAULT_STATE={
 offers:[],
 profile:{name:"Yassir Tagemouati",headline:"Big Data engineering student, EIDIA, UEMF, Fès (2022–2027)",skills:["AWS S3","Azure Synapse","ADF","ADLS Gen2","Key Vault","Snowflake","Spark","Hadoop/HDFS","MapReduce","Airflow","PostgreSQL","SQL","Power BI","Python","Docker","Git","Medallion architecture"],links:{github:"",linkedin:"",portfolio:""},languages:"French (advanced), English (advanced), Arabic (native)",prefs:"Funded or industrial PhD in data engineering, big data, cloud data architecture. Non-EU candidate based in Morocco.",cvs:[]},
 sources:[],
 contacts:[],
 env:{provider:"ollama",model:"gemma4:26b",gemini_model:"gemini-4-hydrogen",openai_model:"gpt-6.1-sol",threshold:50}
};

let S=JSON.parse(localStorage.getItem("phdradar")||"null")||structuredClone(DEFAULT_STATE);
delete S.run;
delete S.apps;
delete S.settings;
S.env=S.env||structuredClone(DEFAULT_STATE.env);
S.logs=[];
S.reports=S.reports||{};
S.f=S.f||{q:"",country:"",type:"",cat:"",min:0,hideExp:true,sort:"chance",dir:-1};
S.cur=null;
S.tab=document.cookie.replace(/(?:(?:^|.*;\s*)phdradar_tab\s*\=\s*([^;]*).*$)|^.*$/,"$1")||"dash";
if(!TABS.some(t=>t[0]===S.tab))S.tab="dash";
S.stopping=false;

const save=()=>{
  const{cur,stopping,run,logs,...rest}=S;
  localStorage.setItem("phdradar",JSON.stringify(rest));
  document.cookie=`phdradar_tab=${S.tab};path=/;max-age=2592000`;
};

function clearPageState(){
  delete S.run;
  save();
  location.reload();
}

const log=m=>{S.logs.unshift(new Date().toLocaleTimeString()+"  "+m);S.logs=S.logs.slice(0,200)};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",2600)}
async function api(path,opt,ms=30000){
  try{
    const ctrl=new AbortController();
    const timeout=setTimeout(()=>ctrl.abort(),ms);
    const r=await fetch("/api"+path,{...opt,signal:ctrl.signal});
    clearTimeout(timeout);
    if(!r.ok)return null;
    return await r.json();
  }catch(e){return null}
}
const days=d=>d?Math.ceil((new Date(d)-new Date(today))/864e5):null;
function dl(o){const n=days(o.deadline);if(n===null)return'<span class="pill mut">unknown</span>';if(n<0)return'<span class="pill bad">expired</span>';if(n<=14)return`<span class="pill warn">${n} d left</span>`;return`<span class="pill ok">${o.deadline}</span>`}
const pctVal=v=>{const n=parseInt(v,10);return Number.isFinite(n)?Math.max(0,Math.min(100,n)):0};
const meter=v=>{const p=pctVal(v);return`<span class="meter"><b style="width:${p}%"></b></span> <b>${p}%</b>`};
function dlFile(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:type||"text/plain"}));a.download=name;a.click()}

function nav(){
  $("#nav").innerHTML='<div class="logo">PhD<i>·</i>Radar</div>'
    +TABS.map((t,i)=>`<button data-t="${t[0]}" class="${S.tab==t[0]?"on":""}" title="Key ${i+1}">${t[1]}</button>`).join("")
    +'<div style="margin-top:auto;padding-top:12px"><button class="b warn" style="width:100%;font-size:12px" onclick="clearPageState()">Clear Page State</button></div>';
}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t)go(t)};
function go(t){S.tab=t;nav();render()}
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)){if(e.key=="Escape")e.target.blur();return}
 const n=+e.key;if(n>=1&&n<=TABS.length)go(TABS[n-1][0]);if(e.key=="/"){e.preventDefault();const q=$("#q");if(q)q.focus()}});
function render(){({dash,detail,profile,src,contacts}[S.tab]||dash)();save()}

function filtered(){
  const f=S.f,q=f.q.toLowerCase();
  const hit=o=>{
    const h=(o.title+" "+o.institution+" "+o.industry_partner+" "+(o.category||"")+" "+(o.keywords||[]).join(" ")+" "+o.description_text).toLowerCase();
    if(!q)return true;
    return q.split(/\s+or\s+/).some(p=>p.split(/\s+and\s+|\s+/).filter(Boolean).every(w=>w[0]=="-"?!h.includes(w.slice(1)):h.includes(w)));
  };
  return S.offers.filter(o=>hit(o)&&(!f.country||o.country==f.country)&&(!f.type||o.program_type==f.type)&&(!f.cat||(o.category||"Other STEM")==f.cat)&&pctVal(o.chance)>=f.min&&(!f.hideExp||days(o.deadline)===null||days(o.deadline)>=0))
  .sort((a,b)=>{let x=a[f.sort],y=b[f.sort];if(f.sort=="deadline"){x=x||"9";y=y||"9"}return(x>y?1:x<y?-1:0)*f.dir});
}

function dash(){
  const L=filtered();
  const opt=k=>[...new Set(S.offers.map(o=>o[k]).filter(Boolean))].map(v=>`<option ${S.f[k=="program_type"?"type":k]==v?"selected":""}>${esc(v)}</option>`).join("");
  const soon=S.offers.filter(o=>{const n=days(o.deadline);return n!==null&&n>=0&&n<=14}).length;
  const thr=S.env.threshold||50;
  const hi=S.offers.filter(o=>pctVal(o.chance)>=thr).length;
  const th=(k,l)=>`<th data-s="${k}">${l}${S.f.sort==k?(S.f.dir<0?" ▾":" ▴"):""}</th>`;
  const activeModel=S.env.provider=="gemini"?S.env.gemini_model:S.env.provider=="openai"?S.env.openai_model:S.env.model;
  $("#app").innerHTML=`<div class="bar" style="justify-content:space-between"><h1>Offers <small class="mut" style="font:13px sans-serif">.env AI: <b>${esc(S.env.provider)}</b> (${esc(activeModel)})</small></h1><button class="b warn" onclick="clearPageState()">Clear Page State</button></div>
  ${runCard()}
  <div class="grid" style="margin-bottom:14px"><div class="card"><div class="stat">${S.offers.length}</div>offers stored</div><div class="card"><div class="stat">${hi}</div>above ${thr}% acceptance</div><div class="card"><div class="stat ${soon?"warn":""}">${soon}</div>deadlines within 14 days</div></div>
  <div class="bar">
    <input id="q" placeholder="Search: spark and azure, -java (press /)" value="${esc(S.f.q)}" style="min-width:220px">
    <select id="fcat"><option value="">All categories (${S.offers.length})</option>${[...new Set(S.offers.map(o=>o.category||"Other STEM"))].map(v=>`<option value="${esc(v)}" ${S.f.cat==v?"selected":""}>${esc(v)}</option>`).join("")}</select>
    <select id="fc"><option value="">All countries</option>${opt("country")}</select>
    <select id="ft"><option value="">All programs</option>${opt("program_type")}</select>
    <label style="margin:0">Min % <input id="fm" type="number" min="0" max="100" value="${S.f.min}" style="width:60px"></label>
    <label style="margin:0"><input id="fe" type="checkbox" ${S.f.hideExp?"checked":""}> hide expired</label>
    <button class="b p" id="score">Score % (Fast)</button>
    <button class="b" id="reset">Clear DB offers</button>
    <button class="b" id="ics">Deadlines .ics</button>
  </div>
  <div class="tw"><table><thead><tr>${th("title","Offer")}${th("category","Category")}${th("country","Country")}${th("deadline","Deadline")}${th("chance","Accepted %")}</tr></thead><tbody>
  ${L.map(o=>`<tr class="row" data-id="${o.id}">
    <td><b>${esc(o.title)}</b><br><span class="mut">${[o.industry_partner,o.institution,o.city].filter(Boolean).map(esc).join(" · ")||esc(o.source)}</span></td>
    <td><span class="chip">${esc(o.category||"Other STEM")}</span></td>
    <td>${esc(o.country)}</td>
    <td>${dl(o)}</td>
    <td>${meter(o.chance)} <button class="b why-btn" data-wid="${o.id}" style="padding:2px 7px;font-size:12px;margin-left:6px">Why ${pctVal(o.chance)}%?</button></td>
  </tr>`).join("")||'<tr><td colspan="5" class="mut">No offers match. Run research or adjust filters.</td></tr>'}</tbody></table></div>`;

  const rr=()=>{S.f.q=$("#q").value;render();const q=$("#q");q.focus();q.setSelectionRange(99,99)};
  $("#q").oninput=rr;
  $("#fcat").onchange=e=>{S.f.cat=e.target.value;render()};
  $("#fc").onchange=e=>{S.f.country=e.target.value;render()};
  $("#ft").onchange=e=>{S.f.type=e.target.value;render()};
  $("#fm").onchange=e=>{S.f.min=+e.target.value||0;render()};
  $("#fe").onchange=e=>{S.f.hideExp=e.target.checked;render()};
  document.querySelectorAll("th[data-s]").forEach(h=>h.onclick=()=>{const k=h.dataset.s;S.f.dir=S.f.sort==k?-S.f.dir:-1;S.f.sort=k;render()});
  document.querySelectorAll(".why-btn").forEach(b=>b.onclick=e=>{e.stopPropagation();S.cur=b.dataset.wid;go("detail");setTimeout(()=>$("#whyBtn")?.click(),50)});
  document.querySelectorAll("tr.row").forEach(r=>r.onclick=()=>{S.cur=r.dataset.id;go("detail")});
  $("#score").onclick=scoreAll;
  $("#reset").onclick=async()=>{if(!confirm("Delete all collected offers from DB?"))return;await api("/offers/reset",{method:"POST"});S.offers=[];render()};
  $("#ics").onclick=ics;
}

function runCard(){
  const r=S.run,en=S.sources.filter(s=>s.enabled).length,on=r&&r.running;
  let btn=on?(S.stopping?'<button class="b p" disabled>Stopping…</button>':'<button class="b p" disabled>Researching…</button> <button class="b" onclick="stopRun()">Stop</button>'):'<button class="b p" onclick="crawl()">Start research</button>';
  return `<div class="card" id="run"><div class="bar" style="margin:0">${btn}<span class="mut">Ready (0%) · Visits ${en} enabled sources.</span></div>${r?runBody(r):""}</div>`;
}
function runBody(r){
  const pc=r.total?Math.round(r.done/r.total*100):0,nm=id=>(S.sources.find(s=>s.id==id)||{program:id}).program;
  const cl={ok:"ok",error:"bad",running:"warn",waiting:"mut",skipped:"mut",needs_login:"warn"};
  const loginBanner=(r.login_prompted&&r.login_prompted.length)?`<div style="margin:8px 0;padding:8px 10px;border:1px solid var(--warn);border-radius:6px"><b class="warn">Login Required:</b> Opened browser window for ${r.login_prompted.map(u=>`<code>${esc(u)}</code>`).join(", ")}. Log in inside that browser window, then click <b>Start research</b> again (or click <b>Capture this page</b> in Sources).</div>`:"";
  return (r.msg?`<p class="bad" style="margin:10px 0 0">${esc(r.msg)}</p>`:"")
    +loginBanner
    +(r.total?`<p style="margin:10px 0 4px">${meter(pc)} ${r.done}/${r.total} sources, <b>${r.new||0}</b> new offers${r.running?"":" (finished)"}</p>`:"")
    +(r.sources||[]).map(s=>`<span class="chip ${s.status=="ok"?"g":s.status=="error"?"r":s.status=="needs_login"?"w":""}" title="${esc(s.error||s.note||"")}">${esc(nm(s.id))}: <span class="${cl[s.status]||"mut"}">${esc(s.status)}${s.found!=null&&s.status=="ok"?" · "+s.found+" new":""}${s.note?" · "+esc(s.note):""}</span></span>`).join("")
    +(r.sources||[]).filter(s=>s.status=="error").map(s=>`<div class="bad" style="font-size:12px;margin-top:4px">${esc(nm(s.id))}: ${esc(s.error)}</div>`).join("");
}
function refreshRun(){const e=$("#run");if(e)e.outerHTML=runCard()}
async function crawl(){
  S.stopping=false;const total=S.sources.filter(s=>s.enabled).length;
  S.run={running:true,done:0,total,new:0,sources:[],msg:"",login_prompted:[]};log("Research started on "+total+" sources");refreshRun();
  const r=await api("/crawl/start",{method:"POST"});
  if(!r){S.run={running:false,done:0,total:0,new:0,sources:[],msg:"Backend not reachable. Start with: .\\.venv\\Scripts\\python.exe run.py"};refreshRun();return}
  poll();
}
async function poll(){
  const s=await api("/crawl/status");
  if(!s){S.run={...S.run,running:false,msg:"Lost connection to backend."};refreshRun();return}
  S.run={msg:"",...s};if(!s.running)S.stopping=false;refreshRun();
  if(s.running){setTimeout(poll,1500);return}
  const o=await api("/offers");if(o)S.offers=o;
  const ct=await api("/contacts");if(ct)S.contacts=ct;
  save();
  log("Research finished: "+(s.new||0)+" new offers");toast((s.new||0)+" new offers found");if(S.tab=="dash")render();
}
async function stopRun(){S.stopping=true;refreshRun();await api("/crawl/stop",{method:"POST"})}

async function scoreAll(){
  const cfgS=await api("/settings");if(cfgS)S.env=cfgS;
  toast(`Fast % scoring via ${S.env.provider.toUpperCase()} (.env)...`);
  const r=await api("/score",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:S.profile})},600000);
  if(r){
    const o=await api("/offers");if(o)S.offers=o;
    toast(`Scored ${r.scored} offers`);render();
  }else toast("Scoring failed. Check AI_PROVIDER & API key in .env.");
}

function ics(){
  const ev=S.offers.filter(o=>o.deadline).map(o=>`BEGIN:VEVENT\nUID:${o.id}@phdradar\nDTSTART;VALUE=DATE:${o.deadline.replace(/-/g,"")}\nSUMMARY:Deadline: ${o.title.replace(/[,;]/g," ")}\nEND:VEVENT`).join("\n");
  dlFile("phd-deadlines.ics","BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//PhD-Radar//EN\n"+ev+"\nEND:VCALENDAR","text/calendar");
}

function detail(){
  const o=S.offers.find(x=>x.id==S.cur);
  if(!o){$("#app").innerHTML='<h1>Report</h1><p class="mut">Select an offer in Offers to inspect it.</p>';return}
  const rep=S.reports[o.id],ch=pctVal(o.chance);
  $("#app").innerHTML=`<div class="bar"><button class="b" id="back">Back to offers</button><button class="b p" id="whyBtn">Why ${ch}%? (Explain Score)</button><button class="b" id="deep">Full Deep Report</button><button class="b" id="md">Export Markdown</button></div>
  <h1>${esc(o.title)}</h1><p class="mut">${esc(o.industry_partner)} · ${esc(o.institution)} · ${esc(o.city)}, ${esc(o.country)} · ${esc(o.program_type)} · <a href="${esc(o.url)}" target="_blank" rel="noopener">open original page</a></p>
  <div class="grid">
    <div class="card"><h3>Acceptance Chance</h3><div class="stat">${ch}%</div>${meter(ch)}<p class="mut">Skill match: ${pctVal(o.match)}%</p></div>
    <div class="card"><h3>Deadline & Funding</h3>${dl(o)}<p>${esc(o.funding||"Funding not stated")}</p></div>
    <div class="card"><h3>Category</h3><span class="chip">${esc(o.category||"Other STEM")}</span><p class="mut">${(o.requires||[]).map(r=>esc(r)).join(", ")}</p></div>
  </div>
  <div class="card"><h3>Why ${ch}%? (On-Demand Explanation)</h3>${o.score_explanation?`<pre>${esc(o.score_explanation)}</pre>`:'<p class="mut">Click <b>Why '+ch+'%?</b> above to generate the explanation on demand (saves tokens during bulk scoring).</p>'}</div>
  <div class="card"><h3>Offer Text</h3><p>${esc(o.description_text)}</p></div>
  <div class="card"><h3>Full Deep Report</h3>${rep?`<pre>${esc(rep)}</pre>`:'<p class="mut">Click <b>Full Deep Report</b> for a cited section-by-section evaluation.</p>'}</div>`;

  $("#back").onclick=()=>go("dash");
  $("#whyBtn").onclick=async()=>{
    toast("Generating score explanation...");
    const res=await fetch("/api/offers/"+o.id+"/explain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:S.profile})});
    const r=await res.json();
    if(res.ok){o.score_explanation=r.explanation;save();render()}
    else toast("Error: "+(r.error||res.statusText));
  };
  $("#deep").onclick=async()=>{
    toast("Running deep analysis...");
    const res=await fetch("/api/offers/"+o.id+"/report",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({profile:S.profile})});
    const r=await res.json();
    S.reports[o.id]=res.ok?r.markdown:`# Error (${res.status})\n\n${r.error||res.statusText}`;
    render();
  };
  $("#md").onclick=()=>dlFile(o.id+"-report.md",S.reports[o.id]||o.score_explanation||"# "+o.title);
}

function profile(){
  const p=S.profile;
  $("#app").innerHTML=`<h1>Profile & CVs</h1><div class="card"><label>Name</label><input id="pn" value="${esc(p.name)}" style="width:100%"><label>Headline</label><input id="ph" value="${esc(p.headline)}" style="width:100%">
  <label>Skills (comma separated)</label><textarea id="ps">${esc(p.skills.join(", "))}</textarea><label>Languages</label><input id="pl" value="${esc(p.languages)}" style="width:100%">
  <label>Preferences & Eligibility Notes</label><textarea id="pp">${esc(p.prefs)}</textarea>
  <div class="bar" style="margin-top:10px"><button class="b p" id="sp">Save profile</button></div></div>
  <div class="card"><h3>CV Versions (Full Text Extracted for AI)</h3><input type="file" id="cv" accept=".pdf,.docx,.txt,.md" multiple>
  ${p.cvs.map((c,i)=>`<div class="bar" style="margin-top:8px"><b>${esc(c.name)}</b><span class="mut">${c.size} KB · ${c.chars||0} chars extracted</span><button class="b" data-d="${i}">Remove</button></div>`).join("")||'<p class="mut">Upload your PDF/DOCX CV so all projects, internships, and skills are used by the AI.</p>'}</div>`;
  $("#sp").onclick=async()=>{Object.assign(p,{name:$("#pn").value,headline:$("#ph").value,skills:$("#ps").value.split(",").map(s=>s.trim()).filter(Boolean),languages:$("#pl").value,prefs:$("#pp").value});save();await api("/profile",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});toast("Profile saved")};
  $("#cv").onchange=async e=>{for(const f of e.target.files){const fd=new FormData();fd.append("file",f);const res=await api("/cvs",{method:"POST",body:fd});p.cvs=p.cvs.filter(x=>x.name!==f.name);p.cvs.push({name:f.name,size:Math.round(f.size/1024),chars:res?.chars||0});toast(`Extracted ${res?.chars||0} chars from ${f.name}`)}render()};
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{const rem=p.cvs.splice(+b.dataset.d,1)[0];if(rem)await api("/cvs/"+encodeURIComponent(rem.name),{method:"DELETE"});render()});
}

async function addOffer(){const v=$("#nu").value.trim();if(!v)return;const r=await api("/offers/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(/^https?:\/\//.test(v)?{url:v}:{text:v})});if(r&&r.id){const o=await api("/offers");if(o)S.offers=o;$("#nu").value="";toast("Offer added")}else toast("Could not read URL")}
async function brOpen(){const r=await api("/browser/open",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:$("#bu").value.trim()})});toast(r?"Browser opened":"Install Playwright first")}
async function brCap(){toast("Capturing page proposals...");const r=await api("/browser/capture",{method:"POST"});if(r){const o=await api("/offers");if(o)S.offers=o;toast(r.added+" offer(s) added")}else toast("Open browser first")}
async function brClose(){await api("/browser/close",{method:"POST"});toast("Browser closed")}

async function src(){
  const v=await api("/version"),diag=await api("/diagnostics"),r=await api("/sources");if(Array.isArray(r))S.sources=r;
  $("#app").innerHTML=`<div class="bar" style="justify-content:space-between"><h1>Sources & Discovery <small class="mut" style="font:13px sans-serif">${v?"v"+esc(v.version)+" · .env: "+(v.env_loaded?"loaded":"missing")+" · data: "+esc(v.data_dir):""}</small></h1><button class="b warn" onclick="clearPageState()">Clear Page State</button></div>
  ${runCard()}
  ${diag?`<div class="card"><h3>System Status (Configured via <code>.env</code>)</h3><div class="bar" style="margin:0">
    <span class="pill ${diag.env_loaded?"ok":"warn"}">.env: ${diag.env_loaded?"Loaded":"Not found"}</span>
    <span class="pill ${diag.ai.ok?"ok":"bad"}">AI (${esc(diag.ai.provider)}): ${diag.ai.ok?esc(diag.ai.model):esc(diag.ai.error)}</span>
    <span class="pill ${diag.playwright_installed?"ok":"warn"}">Playwright: ${diag.playwright_installed?"Ready":"Missing"}</span>
    <span class="pill ok">DB: ${diag.db.offers} offers · ${diag.db.contacts} contacts</span>
    <span class="pill ${diag.cvs.length?"ok":"warn"}">CVs: ${diag.cvs.length} indexed</span>
  </div></div>`:""}
  <div class="bar"><button class="b p" id="hc">Run health check</button><button class="b" id="rs">Reset sources to defaults</button></div>
  <div class="card"><h3>Assisted Login Browser (ANRT CIFRE, ADUM & Login Portals)</h3><p class="mut" style="margin:0 0 8px;font-size:12px">Cookies saved here are shared automatically with the background crawler.</p><input id="bu" value="https://offres-et-candidatures-cifre.anrt.asso.fr/" style="width:55%"> <button class="b p" onclick="brOpen()">Open browser</button> <button class="b" onclick="brCap()">Capture this page</button> <button class="b" onclick="brClose()">Close</button></div>
  <div class="card"><h3>University Portal Discovery Agent (<code>config/universities.yaml</code>)</h3>
    <div class="bar" style="margin:0">
      <select id="dcountry"><option value="">All countries (${v?v.universities:0} unis)</option><option>France</option><option>Germany</option><option>Switzerland</option><option>United Kingdom</option><option>Netherlands</option><option>Belgium</option><option>Denmark</option><option>Norway</option><option>Sweden</option><option>Spain</option></select>
      <input id="dlim" type="number" value="150" min="1" max="500" style="width:75px">
      <button class="b p" id="drun">Discover University Portals</button>
    </div><div id="dstat" class="mut" style="font-size:12px;margin-top:6px"></div>
  </div>
  <div class="card"><input id="nu" placeholder="Paste offer URL or text" style="width:60%"> <button class="b p" onclick="addOffer()">Add as offer</button> <button class="b" id="au">Watch as source</button></div>
  <div class="tw"><table><thead><tr><th>On</th><th>Country</th><th>Program</th><th>URL</th><th>Health</th></tr></thead><tbody>${S.sources.map((s,i)=>`<tr><td><input type="checkbox" data-i="${i}" ${s.enabled?"checked":""}></td><td>${esc(s.country)}</td><td>${esc(s.program)}</td><td style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a></td><td class="${s.health=="ok"?"ok":String(s.health).startsWith("broken")?"bad":"mut"}">${esc(s.health)}</td></tr>`).join("")}</tbody></table></div>
  <h3 style="margin-top:16px">Crawl log</h3><pre>${esc(S.logs.join("\n")||"No activity yet.")}</pre>`;

  document.querySelectorAll("[data-i]").forEach(c=>c.onchange=()=>{S.sources[+c.dataset.i].enabled=c.checked;save();api("/sources/"+S.sources[+c.dataset.i].id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({enabled:c.checked})})});
  $("#hc").onclick=async()=>{toast("Checking all sources...");const h=await api("/sources/health",{method:"POST"},180000);if(h)S.sources=h;render()};
  $("#rs").onclick=async()=>{if(!confirm("Reset sources.yaml to defaults?"))return;const h=await api("/sources/reset",{method:"POST"});if(h)S.sources=h;render()};
  $("#au").onclick=async()=>{const u=$("#nu").value.trim();if(!u)return;await api("/sources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:u})});const h=await api("/sources");if(h)S.sources=h;render()};
  $("#drun").onclick=async()=>{
    const btn=$("#drun");
    btn.disabled=true;
    $("#dstat").innerHTML="<b>Starting university portal discovery...</b>";
    const r=await api("/discover/start",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({country:$("#dcountry").value,limit:+$("#dlim").value||150})});
    if(!r){btn.disabled=false;$("#dstat").innerHTML='<span class="bad">Could not start discovery (backend unreachable or already running).</span>';return}
    const pollD=async()=>{
      const st=await api("/discover/status");
      if(!st){btn.disabled=false;return}
      const html=`<b>${st.running?"Discovering":"Finished"}:</b> ${st.done}/${st.total} · <b>${st.found}</b> portals added · ${esc(st.current)}<pre style="max-height:140px">${esc((st.log||[]).slice(0,30).join("\n"))}</pre>`;
      $("#dstat").innerHTML=html;
      if(st.running){setTimeout(pollD,1200)}
      else{
        btn.disabled=false;
        const h=await api("/sources");if(h)S.sources=h;
        render();
        if($("#dstat"))$("#dstat").innerHTML=html;
      }
    };
    pollD();
  };
}

function contacts(){
  $("#app").innerHTML=`<h1>Contacts</h1><div class="bar"><button class="b p" id="csv">Download contacts.csv</button></div><div class="tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Organization</th><th>Found</th></tr></thead><tbody>
  ${S.contacts.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.email)}</td><td>${esc(c.role)}</td><td>${esc(c.org)}</td><td>${esc(c.date_found)}</td></tr>`).join("")||'<tr><td colspan="5" class="mut">No contacts yet.</td></tr>'}</tbody></table></div>`;
  $("#csv").onclick=()=>{const k=["name","email","role","org","offer_id","date_found"];dlFile("contacts.csv",[k.join(","),...S.contacts.map(c=>k.map(x=>'"'+String(c[x]||"").replace(/"/g,'""')+'"').join(","))].join("\n"),"text/csv")};
}

(async()=>{
  const st=await api("/crawl/status");
  if(st&&st.running){S.run=st;poll();}
  const sr=await api("/sources");if(Array.isArray(sr))S.sources=sr;
  const o=await api("/offers");if(Array.isArray(o))S.offers=o;
  const ct=await api("/contacts");if(Array.isArray(ct))S.contacts=ct;
  const p=await api("/profile");if(p&&p.skills)S.profile=p;
  const cfgS=await api("/settings");if(cfgS&&cfgS.provider)S.env=cfgS;
  nav();render();
})();
</script>
</body>
</html>
